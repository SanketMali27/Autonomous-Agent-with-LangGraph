models:
  - type: main
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: https://api.groq.com/openai/v1
      temperature: 0.2

rails:
  input:
    flows:
      - self check input

  output:
    flows:
      - self check output

  dialog:
    user_messages:
      embeddings_only: false